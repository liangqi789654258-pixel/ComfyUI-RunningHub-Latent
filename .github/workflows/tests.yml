name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: plugin (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # torch CPU 版：test_core 需要；用官方 cpu 源装体积最小
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests safetensors numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # 每个文件单独跑并打名字：失败时日志里一眼看出是哪一个
      - name: Plugin suites
        run: |
          set -e
          for f in tests/test_core.py tests/test_errors.py tests/test_keyvault.py \
                   tests/test_s0_fixtures.py tests/test_package.py; do
            echo "===== $f ====="
            python "$f"
          done

  desktop:
    name: desktop (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt6 在无桌面的 Linux 上需要这些系统库，少一个就是
      # "could not load the Qt platform plugin xcb"
      - name: System libs for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fonts-noto-cjk

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # 先单独验一次 Qt：平台插件加载不了的话，后面 6 个套件会一起红，
      # 这条能让失败原因一眼可见
      - name: Qt smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import PySide6
          from PySide6.QtWidgets import QApplication, QLabel
          app = QApplication([])
          w = QLabel('ok'); w.show()
          print('PySide6', PySide6.__version__, '| offscreen OK')
          "

      # 每个套件一个独立步骤：失败时在 Actions 页面直接看到是哪个文件，
      # 不用登录也能从公开的 job steps 里读到结论
      - name: 1. tests_i18n.py
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          CUDA_VISIBLE_DEVICES: ""
        run: python tests_i18n.py

      # 每个套件一个独立步骤：失败时在 Actions 页面直接看到是哪个文件，
      # 不用登录也能从公开的 job steps 里读到结论
      - name: 2. tests_ui.py
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          CUDA_VISIBLE_DEVICES: ""
        run: python tests_ui.py

      # 每个套件一个独立步骤：失败时在 Actions 页面直接看到是哪个文件，
      # 不用登录也能从公开的 job steps 里读到结论
      - name: 3. tests_runner.py
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          CUDA_VISIBLE_DEVICES: ""
        run: python tests_runner.py

      # 每个套件一个独立步骤：失败时在 Actions 页面直接看到是哪个文件，
      # 不用登录也能从公开的 job steps 里读到结论
      - name: 4. tests_embed.py
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          CUDA_VISIBLE_DEVICES: ""
        run: python tests_embed.py

      # 每个套件一个独立步骤：失败时在 Actions 页面直接看到是哪个文件，
      # 不用登录也能从公开的 job steps 里读到结论
      - name: 5. tests_thumbs.py
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          CUDA_VISIBLE_DEVICES: ""
        run: python tests_thumbs.py

      # 每个套件一个独立步骤：失败时在 Actions 页面直接看到是哪个文件，
      # 不用登录也能从公开的 job steps 里读到结论
      - name: 6. tests_gui_offscreen.py
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          CUDA_VISIBLE_DEVICES: ""
        run: python tests_gui_offscreen.py
