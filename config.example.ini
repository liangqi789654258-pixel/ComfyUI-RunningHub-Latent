; ComfyUI-RunningHub-Latent 全局配置
; ------------------------------------------------------------
; 用法：把本文件复制一份，改名为 config.ini，填好下面的值即可。
; 填好之后，画布上所有 RH 节点的 api_key 都可以留空。
; config.ini 已被 .gitignore 排除，不会误提交到 GitHub。
;
; 注意：节点上显式填写的值优先级更高，方便临时换 Key 试跑。

[runninghub]

; RunningHub API Key（控制台 -> 账号设置 -> API 里获取）
api_key =

; 默认工作流 ID，节点上不填 workflow_id 时使用
default_workflow_id =

; 接口地址，一般不用改
base_url = https://www.runninghub.cn

; 任务超时（秒）
timeout = 600

; 状态轮询间隔（秒），不建议低于 3
poll_interval = 5

; 是否启用本地 latent 缓存（同参数命中时跳过云端调用，不扣费）。
; 极简版没有这个开关输入框，想关缓存就在这里改。
use_cache = true

; 是否使用高性能实例（instanceType=plus，消耗更多额度）
use_high_performance = false
